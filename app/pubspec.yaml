#include "Config.h"
#include "PinMap.h"
#include "RelayManager.h"
#include "LEDController.h"
#include "AudioEngine.h"
#include "BluetoothServer.h"
#include "StudioNetworkManager.h"

RelayManager relayManager;
LEDController ledController;
AudioEngine audioEngine;
StudioNetworkManager networkManager;
BluetoothServer bluetoothServer(relayManager, ledController);

void onSystemStateChanged() {
  // Placeholder for telemetry or state propagation.
}

void setup() {
  Serial.begin(SERIAL_BAUD_RATE);
  pinMode(STATUS_LED_PIN, OUTPUT);

  relayManager.begin();
  relayManager.setOnStateChangedCallback(onSystemStateChanged);

  ledController.begin();
  ledController.setMode(MODE_HYPERION);

  audioEngine.begin();
  bluetoothServer.begin();
  networkManager.begin();

  relayManager.selfTestRelays();
}

void loop() {
  bluetoothServer.update();
  networkManager.update();
  audioEngine.update();
  ledController.update(audioEngine.getVuLevel());

  if (WiFi.status() == WL_CONNECTED) {
    digitalWrite(STATUS_LED_PIN, HIGH);
  } else {
    digitalWrite(STATUS_LED_PIN, (millis() / 500) % 2 == 0 ? HIGH : LOW);
  }

  delay(10);
}

